name: Conferir atualização publicada
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Compilar SDE Suporte para Windows']
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Conferir release e manifesto publicados pelo job Windows
        shell: bash
        run: |
          set -euo pipefail
          release_sha=$(gh api "repos/$GH_REPO/releases/latest" --jq '.target_commitish')
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$current_sha" ]]; then
            echo 'Uma compilação mais recente substituiu este resultado.'
            exit 0
          fi
          [[ "$release_sha" == "$current_sha" ]]
          gh release download --repo "$GH_REPO" --pattern update.json --dir manifest
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          value=json.loads(Path('manifest/update.json').read_text())
          assert re.fullmatch(r'\d+\.\d+\.\d+',value['version'])
          for name in ('SDE-Suporte-Cliente-Instalar.exe','SDE-Suporte-Tecnico-Base.exe'):
              item=value['assets'][name]
              assert re.fullmatch(r'[a-fA-F0-9]{64}',item['sha256'])
              assert 1_000_000<=item['size']<=250_000_000
          print('Manifesto da atualização Windows publicado e válido.')
          PY
