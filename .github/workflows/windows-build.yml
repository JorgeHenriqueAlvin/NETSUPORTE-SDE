name: Compilar SDE Suporte para Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'
      - 'installer/**'
      - 'tests/**'
      - 'bootstrapper/**'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Testar publicação e integridade dos pacotes
        run: python -m unittest discover -s tests -p test_publish_installers.py
      - name: Validar sintaxe dos scripts PowerShell
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Compilar aplicativos Windows
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Validar atualizador e rejeicao de pacote adulterado
        shell: pwsh
        run: ./tests/Test-Updater.ps1
      - name: Preparar pacote de teste e compatibilidade
        shell: pwsh
        run: ./scripts/Build-Template.ps1
      - name: Testar instalacao, seis tecnicos, captura real e varredura IP
        shell: pwsh
        run: ./scripts/Test-Windows.ps1
      - name: Conferir executaveis PE
        shell: pwsh
        run: |
          foreach ($file in @('dist/Agent/SDE-Suporte-Cliente.exe','dist/Technician/SDE-Suporte-Tecnico.exe')) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file))
            if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "PE invalido: $file" }
          }
      - name: Gerar instaladores independentes de tecnico e cliente
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup.' }
          }
          foreach ($role in @('client','technician')) {
            & $compiler "/DSetupRole=$role" installer/SDE-Suporte.iss
            if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador $role." }
            if ($role -eq 'client') {
              $hash = (Get-FileHash release/SDE-Suporte-Cliente-Instalar.exe -Algorithm SHA256).Hash
              [IO.File]::WriteAllText((Join-Path $PWD 'release/SDE-Suporte-Cliente-Instalar.exe.sha256'),$hash)
            }
          }
      - name: Verificar pacote Cliente válido, ausente, corrompido e incompatível
        shell: pwsh
        run: |
          dotnet run --project tests/SdeSuporte.Tests.csproj -c Release -- client-package release/SDE-Suporte-Cliente-Instalar.exe 0.12.11
          if ($LASTEXITCODE -ne 0) { throw 'Verificacao de pacote e persistencia falhou.' }
      - name: Testar instalacao e remocao da versao Tecnico
        shell: pwsh
        run: |
          $base = (Resolve-Path release/SDE-Suporte-Tecnico-Base.exe).Path
          $setup = Join-Path $env:RUNNER_TEMP 'SDE-Tecnico-Autorizado-Teste.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'SDE-Team-Fixture'
          dotnet run --project tests/SdeSuporte.Tests.csproj -c Release -- package-technician $base $fixture $setup
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar instalador tecnico autorizado de teste.' }
          $target = Join-Path $env:RUNNER_TEMP 'SDE-Suporte-Teste'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Instalacao falhou: $($process.ExitCode)" }
          if (-not (Get-ScheduledTask -TaskName SDE-Suporte-Atualizacao -ErrorAction SilentlyContinue)) { throw 'Atualizacao automatica nao registrada.' }
          if (-not (Test-Path "$target\Technician\SDE-Suporte-Tecnico.exe")) { throw 'Console nao instalado.' }
          if (Test-Path "$target\Agent\SDE-Suporte-Cliente.exe") { throw 'Versao Tecnico instalou agente indevidamente.' }
          if (-not (Test-Path "$target\Packages\SDE-Suporte-Cliente-Instalar.exe")) { throw 'Pacote para implantacao remota ausente.' }
          $expected = (Get-Content "$target\Packages\SDE-Suporte-Cliente-Instalar.exe.sha256" -Raw).Trim()
          if ((Get-FileHash "$target\Packages\SDE-Suporte-Cliente-Instalar.exe" -Algorithm SHA256).Hash -ne $expected) { throw 'Pacote remoto nao corresponde ao hash.' }
          # Reproduce an incomplete previous update with a same-version EXE whose bytes differ.
          $packagePath = "$target\Packages\SDE-Suporte-Cliente-Instalar.exe"
          $staleBytes = [IO.File]::ReadAllBytes($packagePath)
          $staleBytes[$staleBytes.Length - 1] = $staleBytes[$staleBytes.Length - 1] -bxor 1
          [IO.File]::WriteAllBytes($packagePath,$staleBytes)
          [IO.File]::WriteAllText("$target\Packages\SDE-Suporte-Cliente-Instalar.exe.sha256",('0' * 64))
          (Get-Item "$target\Packages\SDE-Suporte-Cliente-Instalar.exe").LastWriteTime = (Get-Date).AddDays(2)
          $repair = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -PassThru -Wait
          if ($repair.ExitCode -ne 0) { throw 'Reinstalacao do Tecnico falhou.' }
          dotnet run --project tests/SdeSuporte.Tests.csproj -c Release -- client-package "$target\Packages\SDE-Suporte-Cliente-Instalar.exe" 0.12.11
          if ($LASTEXITCODE -ne 0) { throw 'Atualizacao nao recuperou pacote embutido.' }
          $uninstall = Start-Process "$target\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Desinstalacao falhou: $($uninstall.ExitCode)" }
          if (Test-Path "$target\Technician\SDE-Suporte-Tecnico.exe") { throw 'Console nao removido.' }
      - name: Testar versao Cliente configurada automaticamente e atualizacao
        timeout-minutes: 3
        shell: pwsh
        run: |
          $setup = (Resolve-Path release/SDE-Suporte-Cliente-Instalar.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'SDE-Cliente-Instalado'
          $setupLog = Join-Path $env:RUNNER_TEMP 'SDE-Cliente-Setup.log'
          Write-Host "CLIENTE: instalacao inicial $(Get-Date -Format o)"
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target","/LOG=$setupLog") -PassThru -Wait
          if ($install.ExitCode -ne 0 -or -not (Test-Path "$target\Agent\agent.json")) {
            Get-Content $setupLog -ErrorAction SilentlyContinue | Select-Object -Last 100
            Get-Content "$target\scripts\agent-setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 100
            throw "Falha na instalacao do cliente, codigo $($install.ExitCode)."
          }
          if (Test-Path "$target\Technician\SDE-Suporte-Tecnico.exe") { throw 'Cliente recebeu console indevidamente.' }
          $configFile = "$target\Agent\agent.json"
          $original = Get-Content $configFile -Raw | ConvertFrom-Json
          if (-not $original.enrollment.approval.permission.teamWide) { throw 'Cliente nao foi autorizado automaticamente.' }
          $startup = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run' -Name SdeSuporte).SdeSuporte
          if ($startup -notlike "*$target*") { throw 'Inicio automatico ausente.' }
          Write-Host "CLIENTE: iniciar agente $(Get-Date -Format o)"
          $agent = Start-Process "$target\Agent\SDE-Suporte-Cliente.exe" -PassThru
          try {
            Write-Host "CLIENTE: validar descoberta $(Get-Date -Format o)"
            dotnet run --project tests/SdeSuporte.Tests.csproj -c Release -- installed $configFile
            if ($LASTEXITCODE -ne 0) { throw 'Agente instalado nao respondeu a varredura IP.' }
            $legacy = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SDE-Suporte-Cliente-LAN'
            New-Item $legacy -Force | Out-Null
            New-ItemProperty $legacy -Name InstallLocation -Value "$target\Agent" -PropertyType String -Force | Out-Null
            Write-Host "CLIENTE: atualizar agente aberto $(Get-Date -Format o)"
            $upgrade = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -PassThru -Wait
            if ($upgrade.ExitCode -ne 0) { throw 'Atualizacao sobre agente em execucao falhou.' }
            $updated = Get-Content $configFile -Raw | ConvertFrom-Json
            if ($updated.device.id -ne $original.device.id) { throw 'Atualizacao mudou identidade da maquina.' }
            if (Test-Path $legacy) { throw 'Desinstalador antigo duplicado nao foi migrado.' }
          } finally {
            $agent.Refresh()
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
            $uninstall = Start-Process "$target\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
            if ($uninstall.ExitCode -ne 0) { throw 'Falha ao desinstalar cliente.' }
          }
          Write-Host "CLIENTE: encerrado $(Get-Date -Format o)"
          if (Test-Path "$target\Agent\agent.json") { throw 'Configuracao do cliente nao removida.' }
          if (Get-NetFirewallRule -Name SDE-Suporte-LAN-7443 -ErrorAction SilentlyContinue) { throw 'Regra do agente nao removida.' }
      - name: Diagnosticar falha de instalacao
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like '*SDE*' -or $_.MainWindowTitle -like '*SDE*' } | Select-Object Id,ProcessName,MainWindowTitle | Format-Table -AutoSize
          Get-Content "$env:RUNNER_TEMP/SDE-Cliente-Setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 100
          Get-Content "$env:RUNNER_TEMP/SDE-Cliente-Instalado/scripts/agent-setup.log" -ErrorAction SilentlyContinue | Select-Object -Last 100
      - name: Validar instalacao administrativa usada pela implantacao remota
        shell: pwsh
        run: |
          $installer = (Resolve-Path release/SDE-Suporte-Cliente-Instalar.exe).Path
          $expected = (Get-FileHash $installer -Algorithm SHA256).Hash
          $target = Join-Path $env:RUNNER_TEMP 'SDE-Implantacao-Teste'
          try {
            $rejected = $false
            try { ./scripts/Install-RemoteAgent.ps1 -InstallerPath $installer -ExpectedSha256 ('0' * 64) -InstallDirectory $target } catch { $rejected = $true }
            if (-not $rejected -or (Test-Path "$target\Agent\agent.json")) { throw 'Pacote adulterado nao foi bloqueado antes de instalar.' }
            $result = ./scripts/Install-RemoteAgent.ps1 -InstallerPath $installer -ExpectedSha256 $expected -InstallDirectory $target
            if ($result.State -notlike 'Installed*' -or -not (Test-Path "$target\Agent\agent.json")) { throw 'Instalacao administrativa de implantacao falhou.' }
          } finally {
            if (Test-Path "$target\unins000.exe") {
              $uninstall = Start-Process "$target\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
              if ($uninstall.ExitCode -ne 0) { throw 'Desinstalacao da implantacao falhou.' }
            }
          }
      - name: Publicar versão testada para atualização automática
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/Publish-Installers.py
      - uses: actions/upload-artifact@v4
        if: vars.SDE_UPLOAD_ARTIFACTS == 'true'
        with:
          name: SDE-Suporte-Instaladores-0.12.6
          if-no-files-found: error
          path: |
            release/*.exe
            README.md
            QUICKSTART.md



      - uses: actions/upload-artifact@v4
        if: vars.SDE_UPLOAD_ARTIFACTS == 'true'
        with:
          name: SDE-Visual-QA
          path: ${{ runner.temp }}/SDE-Visual-QA/*.png
