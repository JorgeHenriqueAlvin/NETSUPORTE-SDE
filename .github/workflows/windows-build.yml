name: Compilar SDE Suporte para Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'
      - 'installer/**'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validar sintaxe dos scripts PowerShell
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Compilar os dois aplicativos
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Conferir assinaturas de executáveis PE
        shell: pwsh
        run: |
          $files = @('dist/Agent/SDE-Suporte-Cliente.exe','dist/Technician/SDE-Suporte-Tecnico.exe')
          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file))
            if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "PE inválido: $file" }
          }
      - name: Gerar instalador Windows
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup.' }
          }
          & $compiler installer/SDE-Suporte.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar instalador.' }
      - name: Testar instalação e remoção do console
        shell: pwsh
        run: |
          $setup = (Resolve-Path release/SDE-Suporte-Instalador-Windows-x64.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'SDE-Suporte-Teste'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TYPE=technician',"/DIR=$target") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Instalação falhou: $($process.ExitCode)" }
          if (-not (Test-Path "$target\Technician\SDE-Suporte-Tecnico.exe")) { throw 'Console não instalado.' }
          if (Test-Path "$target\package\dist\Agent\SDE-Suporte-Cliente.exe") { throw 'Agente instalado indevidamente na seleção de técnico.' }
          $uninstall = Start-Process "$target\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Desinstalação falhou: $($uninstall.ExitCode)" }
          if (Test-Path "$target\Technician\SDE-Suporte-Tecnico.exe") { throw 'Console não removido.' }
      - uses: actions/upload-artifact@v4
        with:
          name: SDE-Suporte-Windows-x64
          if-no-files-found: error
          path: |
            release/*.exe
            dist/
            scripts/Install-Agent.ps1
            scripts/Uninstall-Agent.ps1
            README.md
